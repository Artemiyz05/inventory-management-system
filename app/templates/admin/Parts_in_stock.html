</head>

<body>

    <div id="conteiner">

        <div id="left_bar">
            <a href="{{ url_for('index_page') }}">
                <img class="bear" src="/static/images/bear.png" alt="bear">
            </a>
        </div>

        <div id="top">
            <nav id="nav">
                <ul class="nav-list">
                    <li>
                        <button class="button" type="button"
                            onclick="window.location.href='{{ url_for('supplier_page') }}'">
                                Поставщик
                        </button>
                    </li>
                    <li><button class="button" type="button">История цен</button></li>
                    <li><button class="button" type="button">Учёт расходов</button></li>
                    <li>

                        </button>

                    <li>

                        <a href="{{ url_for('profile_page') }}">

                </ul>
            </nav>
        </div>

        <div id="main">

    <div class="content">

        <h2>Запчасти на складе</h2>

            <input

                id="search"
                class="text-field"

            <button class="button">Поиск</button>

        <div class="table-container">

                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Артикул</th>
                        <th>Количество</th>

                    </tr>
                </thead>

                <tbody>
<tr>
                            <td>1</td>
                            <td>Подшипник</td>
                            <td>AB-245</td>

                            <td>850 ₽</td>
                        </tr>

                        <tr>
                            <td>2</td>
                            <td>Фильтр масляный</td>
                            <td>OF-123</td>
                            <td>32</td>
                            <td>430 ₽</td>
                        </tr>

                        <tr>
                            <td>3</td>
                            <td>Ремень ГРМ</td>
                            <td>GRM-888</td>
                            <td>7</td>
                            <td>2300 ₽</td>
                        </tr>
                </tbody>

            </table>

</div>
